project_id = "phoenix-esports"

[auth]
enable_signup = false
minimum_password_length = 12
site_url = "https://phoenix-esports.vercel.app"
additional_redirect_urls = [
  "https://phoenix-esports.vercel.app/portal/reset-password",
  "http://localhost:5173/portal/reset-password",
  "http://127.0.0.1:5173/portal/reset-password"
]

[auth.email]
enable_signup = false
enable_confirmations = true

[functions.phoenix-api]
verify_jwt = false

# phoenix-api validates officers and committees JWTs and current database permissions itself.
# Retired public verification/submission/status actions return 410.
